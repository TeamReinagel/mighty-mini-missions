<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="#87ceeb"/>
  
  <!-- Ground -->
  <rect x="0" y="150" width="192" height="42" fill="#8b4513"/>
  <rect x="0" y="150" width="192" height="10" fill="#4caf50"/>
  
  <!-- Cloud -->
  <ellipse cx="50" cy="40" rx="25" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="70" cy="35" rx="20" ry="12" fill="white" opacity="0.8"/>
  <ellipse cx="90" cy="40" rx="25" ry="15" fill="white" opacity="0.8"/>
  
  <!-- Mario body -->
  <ellipse cx="96" cy="115" rx="25" ry="20" fill="#e63946"/>
  
  <!-- Mario head -->
  <circle cx="96" cy="80" r="22" fill="#ffccaa"/>
  
  <!-- Mario hat -->
  <ellipse cx="96" cy="65" rx="26" ry="10" fill="#e63946"/>
  
  <!-- M on hat -->
  <text x="96" y="70" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold" font-size="14">M</text>
  
  <!-- Eyes -->
  <circle cx="90" cy="78" r="3" fill="#333"/>
  <circle cx="102" cy="78" r="3" fill="#333"/>
  
  <!-- Wings -->
  <path d="M65 100 Q45 85 60 70 Q70 85 70 100 Z" fill="white" opacity="0.9"/>
  <path d="M127 100 Q147 85 132 70 Q122 85 122 100 Z" fill="white" opacity="0.9"/>
  
  <!-- Wing block -->
  <rect x="140" y="50" width="30" height="30" fill="#ffd700" stroke="#ff8c00" stroke-width="3" rx="4"/>
  <text x="155" y="72" text-anchor="middle" fill="#333" font-family="sans-serif" font-weight="bold" font-size="20">!</text>
</svg>