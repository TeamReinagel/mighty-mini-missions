[build]
  publish = "."

# The app is static files. `netlify/functions` adds progress sync and the weekly
# Slack report (see README). The local `/server` folder is for optional
# localhost image generation and is not required on Netlify.

[functions]
  directory = "netlify/functions"

# Vision plus an optional transcription can outlast the default 10s limit.
[functions."joyce-tablet"]
  timeout = 26

# Function source sits inside the publish folder; don't serve it as static files.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# The Android project ships with the site folder; it isn't a page.
[[redirects]]
  from = "/joyce-tablet/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/joyce-latest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"

[[headers]]
  for = "/word-monsters/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ghost-word-run/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/monster-maker/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/hatch-match/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Lets Kokoro (the game's natural voice and the test page) use multi-threaded WASM
# where the browser supports it. Hatch Match loads nothing cross-origin except the
# model files, which Hugging Face serves with CORS.
[[headers]]
  for = "/hatch-match/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/otter-slide/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/missions.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
