[build]
  publish = "."

# The app is static files. `netlify/functions` adds progress sync and the weekly
# Slack report (see README). The local `/server` folder is for optional
# localhost image generation and is not required on Netlify.

[functions]
  directory = "netlify/functions"

# Function source sits inside the publish folder; don't serve it as static files.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/word-monsters/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ghost-word-run/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/monster-maker/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/hatch-match/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Lets the Kokoro test page use multi-threaded WASM where the browser supports it.
# The game pages stay unchanged. Model files are fetched with CORS from Hugging Face.
[[headers]]
  for = "/hatch-match/tts/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/otter-slide/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/missions.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
