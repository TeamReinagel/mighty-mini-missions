<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice lab</title>
<style>
  body { font-family: "Avenir Next", "Trebuchet MS", sans-serif; margin: 0; background: #fff8ef; color: #241c33; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { margin: 0 0 4px; }
  p { color: #65597a; }
  textarea { width: 100%; font: inherit; font-size: 1.15rem; padding: 10px; border-radius: 12px; border: 2px solid #eadfce; min-height: 72px; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 18px; }
  .quick button, .row button { font: inherit; border: 0; border-radius: 14px; padding: 10px 16px; background: white; box-shadow: 0 4px 0 #eadfce; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eadfce; }
  .row .name { flex: 1; font-weight: 800; font-size: 1.15rem; }
  .row .state { color: #65597a; min-width: 90px; text-align: right; }
  .row.picked { background: #fff1c9; border-radius: 12px; padding-left: 10px; }
  .row .pick { background: #7c6cf0; color: white; box-shadow: 0 4px 0 #5e50c4; }
  #picked { font-size: 1.2rem; font-weight: 800; margin: 14px 0; }
</style>
</head>
<body>
<main>
  <h1>Voice lab</h1>
  <p>Press Play on each voice and listen to the same line. Press "I like this one" on your favorite, then tell Evan its name.</p>
  <textarea id="line">Hi Gabi. Tap each snack and I will count with you. One. Two. Three. Yes, three!</textarea>
  <div class="quick" id="quick"></div>
  <div id="picked"></div>
  <div id="list"></div>
</main>
<script>
  const VOICES = ["maple", "alloy", "ash", "ballad", "coral", "echo", "fable", "marin", "cedar", "nova", "onyx", "sage", "shimmer", "verse"];
  const LINES = [
    "Hi Gabi. Tap each snack and I will count with you. One. Two. Three. Yes, three!",
    "Tap the green one.",
    "Yes. Cat. Push the sounds together.",
    "Ten ones leave. One ten comes back. Now count the tens."
  ];
  const list = document.querySelector("#list");
  const line = document.querySelector("#line");
  const picked = document.querySelector("#picked");
  let playing = null;
  const saved = localStorage.getItem("voiceLab.pick") || "";

  for (const text of LINES) {
    const b = document.createElement("button");
    b.textContent = text.length > 36 ? `${text.slice(0, 34)}...` : text;
    b.onclick = () => { line.value = text; };
    document.querySelector("#quick").append(b);
  }

  function showPick(name) {
    picked.textContent = name ? `Your pick: ${name}` : "";
    for (const row of list.children) row.classList.toggle("picked", row.dataset.voice === name);
  }

  for (const voice of VOICES) {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.voice = voice;
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = voice === "maple" ? "maple (ChatGPT app voice; may not be offered here)" : voice;
    const state = document.createElement("span");
    state.className = "state";
    const play = document.createElement("button");
    play.textContent = "Play";
    const pick = document.createElement("button");
    pick.className = "pick";
    pick.textContent = "I like this one";
    pick.onclick = () => { localStorage.setItem("voiceLab.pick", voice); showPick(voice); };
    play.onclick = async () => {
      if (playing) playing.pause();
      state.textContent = "Loading...";
      try {
        const res = await fetch("/api/classroom", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "speak", kid: "gabi", voice, text: line.value })
        });
        const data = await res.json();
        if (!data.audioBase64) { state.textContent = "Not available"; return; }
        playing = new Audio(`data:audio/mp3;base64,${data.audioBase64}`);
        state.textContent = "Playing";
        playing.onended = () => { state.textContent = ""; };
        await playing.play();
      } catch {
        state.textContent = "Could not play";
      }
    };
    row.append(name, state, play, pick);
    list.append(row);
  }
  showPick(saved);
</script>
</body>
</html>
